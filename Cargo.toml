workspace = { members = [
    "rucimp",
    "./",
    "crates/macro_map",
    "crates/ruci-cmd",
    "crates/rucimp-tls",
] }
[package]
name = "ruci"
version = "0.0.7"
edition = "2021"
readme = "README.md"
description = "a network proxy framework"
categories = ["network-programming"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
strip = true
debug-assertions = false
incremental = false
#opt-level = 'z' # use this and upx will get the smallest binary

[dependencies]
tracing = "0.1"
rand = { version = "0.8.5", features = ["small_rng"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3.30"
async-trait = "0.1.77"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["io"] }
pin-project-lite = "0.2.13"
scopeguard = "1.2.0"
parking_lot = "0.12.1"
lazy_static = "1"
smallvec = { version = "1.13.1", features = ["serde"] }

serde = { version = "1", features = ["derive"] }

typetag = "0.2.16"
dyn-clone = "1"
anyhow = "1"
typed-builder = "0.18.1"
bitflags = "2.4.2"
url = "2"
base64 = "0.21.7"
sha2 = "0.10.8"


hickory-resolver = { version = "0.24.1", features = ["serde-config"] }

macro_map = { path = "crates/macro_map" }

tun = { version = "0.7.5", features = ["async"], optional = true }

tar = { version = "0.4.43", optional = true }


[features]


trace = []


[dev-dependencies]
env_logger = "0.11.1"
criterion = { version = "0.5.1", features = ["async_tokio"] }

[[bench]]
name = "mathadd"
harness = false
