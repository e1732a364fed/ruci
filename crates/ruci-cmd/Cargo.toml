[package]
name = "ruci-cmd"
version = "0.0.6"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "ruci_cmd"
crate-type = ["rlib", "staticlib", "cdylib"]

[target.'cfg(target_os="android")'.dependencies]
jni = "0.21"

[dependencies]

ruci = { path = "../.." }
rucimp = { path = "../../rucimp" }
data-source = { workspace = true }

tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
serde_path_to_error = { workspace = true }

tar = { workspace = true, optional = true }

axum = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true }

serde-transcode = "1.1"
serde-value = "0.7"

tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

clap = { version = "4.5", features = ["derive"] }
bytesize = "1.3"

chrono = { version = "0.4", optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.5", features = [
  "fs",
  "trace",
  "cors",
], optional = true }

rcgen = { version = "0.13", optional = true }
qrcode = { version = "0.14", optional = true, default-features = false }
flate2 = { version = "1.1.0", optional = true }


[features]
default = ["api_server", "utils"]
lua = ["rucimp/lua"]
lua54 = ["rucimp/lua54"]


# quic = ["rucimp/quic"]
quinn = ["rucimp/quinn"]

file_server = ["rucimp/file_server"]
api_server = ["chrono", "rucimp/api_server", "axum", "utoipa"]
api_client = ["reqwest"]

utils = ["reqwest", "rcgen", "qrcode", "flate2", "tar"]
trace = ["rucimp/trace"]

use-native-tls = ["rucimp/use-native-tls"]
native-tls-vendored = ["rucimp/native-tls-vendored"]

smoltcp = ["rucimp/smoltcp"]
lwip = ["rucimp/lwip"]
steganography = ["rucimp/steganography"]
