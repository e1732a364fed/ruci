[package]
name = "ruci-cmd"
version = "0.0.5"
edition = "2021"

[dependencies]
ruci = { path = "../.." }
rucimp = { path = "../../rucimp", features = ["repl"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["io"] }
futures = "0.3"
tracing = "0.1.40"

tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "=0.2.3"
parking_lot = "0.12.1"

anyhow = "1"
clap = { version = "4.5.13", features = ["derive"] }
bytesize = "1.3.0"


chrono = { version = "0.4.34", optional = true }
axum = { version = "0.7.4", optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.5.0", features = [
    "fs",
    "trace",
    "cors",
], optional = true }

TinyUFO = { version = "0.1.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "native-tls-vendored",
], optional = true }

rcgen = { version = "0.13.1", optional = true }

[features]
lua = ["rucimp/lua"]

lua54 = ["rucimp/lua54"]
tun = ["rucimp/tun"]

quic = ["rucimp/quic"]
quinn = ["rucimp/quinn"]

api_server = ["chrono", "axum", "tower", "tower-http"]
api_client = ["reqwest"]
file_server = ["axum", "tower-http"]

utils = ["reqwest", "rcgen"]
trace = ["rucimp/trace", "TinyUFO"]

use-native-tls = ["rucimp/use-native-tls"]
native-tls-vendored = ["rucimp/native-tls-vendored"]

smoltcp = ["rucimp/smoltcp"]
steganography = ["rucimp/steganography"]
