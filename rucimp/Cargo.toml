[package]
name = "rucimp"
version = "0.0.8"
edition = "2021"

[dependencies]
ruci = { path = ".." }
macro_map = { path = "../crates/macro_map" }
ruci-rustls22 = { path = "../crates/ruci-rustls22" }
ruci-rustls21 = { path = "../crates/ruci-rustls21", optional = true }
file-source = { path = "../crates/file-source" }
user_trait = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tar = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
dyn-clone = { workspace = true }
futures-lite = { workspace = true }
pin-project = { workspace = true }

chrono = { version = "0.4", features = ["serde"] }

serde_json = "1.0"
serde_cbor = "0.11"
serde_path_to_error = "0.1"

strum = "0.27"
strum_macros = "0.27"


lazy_static = "1"
base64 = "0.22"
itertools = "0.14"
thiserror = "2"


ipnet = { version = "2" }
iprange = { version = "0.6" }
regex = { version = "1" }
clash_rules = "0.1.18"
geosite-rs = "0.1.6"

mlua = { version = "0.10", features = [
  "serialize",
  "async",
  "macros",
  'send',
], optional = true }

serde-lua-table = { git = "https://github.com/Nerixyz/serde-lua-table.git", tag = "v0.1.2", optional = true }


libc = { version = "0.2", optional = true }

socket2 = { version = "0.5", optional = true }
rlimit = { version = "0.10", optional = true }

native-tls = { version = "0.2", features = ["alpn"], optional = true }
tokio-native-tls = { version = "0.3", optional = true }

http = "1.1"
tokio-tungstenite = "0.21"
h2 = { version = "0.4" }
hpack = "0.3"


quinn = { version = "0.10", optional = true }

# s2n-quic = { version = "=1.34.0", default-features = false, features = [
#     "provider-address-token-default",
#     "provider-tls-rustls",
# ], optional = true }
# s2n-quic-rustls = { version = "0.34.0", optional = true }


smoltcp = { version = "0.12", optional = true, default-features = false, features = [
  "std",
  "log",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "socket-icmp",
  "socket-udp",
  "socket-tcp",
] }


dashmap = "6.1"
array-init = "2.1"

rustyline = { version = "15.0", optional = true }

md5 = "0.7"
zip = "2.2"

reqwest = { version = "0.12", features = ["json"] }

har = "0.8.1"


[target.'cfg(not(all(target_os = "windows", target_env = "msvc")))'.dependencies]
netstack-lwip = { git = "https://github.com/e1732a364fed/netstack-lwip.git", rev = "b66a15d", optional = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }

[dev-dependencies]

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"
wiremock = "0.6"


[features]
default = ["sockopt"]
steganography = []

# quic = ["s2n-quic", "s2n-quic-rustls", "ruci-rustls21"]
quinn = ["ruci-rustls21", "dep:quinn"]

tun = ["ruci/tun"]
trace = ["ruci/trace"]

lua = ["mlua/luau", "serde-lua-table", "rustyline"]
lua54 = ["mlua/lua54", "mlua/vendored", "serde-lua-table", "rustyline"]

# route = ["ipnet", "iprange", "regex"]

sockopt = ["libc", "socket2", "rlimit"]

use-native-tls = ["native-tls", "tokio-native-tls"]

native-tls-vendored = ["native-tls/vendored", "tokio-native-tls/vendored"]


lwip = ["netstack-lwip"]


[[example]]
name = "lua"
required-features = ["lua"]

[[example]]
name = "lua_infinite"
required-features = ["lua"]

[[example]]
name = "lua_trace"
required-features = ["lua"]

[[example]]
name = "shared"
crate-type = ["lib"]

[[bench]]
name = "spe1_benchmark"
harness = false
