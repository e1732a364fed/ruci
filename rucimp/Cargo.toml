[package]
name = "rucimp"
version = "0.0.8"
edition = "2021"

[dependencies]
ruci = { path = ".." }
macro_map = { path = "../crates/macro_map" }
ruci-recorder = { path = "../crates/ruci-recorder" }
ruci-rustls22 = { path = "../crates/ruci-rustls22" }
ruci-rustls21 = { path = "../crates/ruci-rustls21", optional = true }
user_trait.workspace = true
data-source.workspace = true
tracing.workspace = true
bytes.workspace = true
rand.workspace = true
serde.workspace = true
tokio.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
dyn-clone.workspace = true
# futures-lite.workspace = true
pin-project.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tar.workspace = true
reqwest.workspace = true
base64.workspace = true

axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

strum = "0.27"
strum_macros = "0.27"

lazy_static = "1"
itertools = "0.14"
thiserror = "2"

clash_rules = "0.1.19"
geosite-rs = "0.1.6"

dashmap = "6.1"
array-init = "2.1"

md5 = "0.7"
zip = "2.2"

http = "1.1"
tokio-tungstenite = "0.26"
h2 = "0.4"
hpack = "0.3"


utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

mlua = { version = "0.10", features = [
  "serialize",
  "async",
  "macros",
  'send',
], optional = true }

serde-lua-table = { git = "https://github.com/Nerixyz/serde-lua-table.git", tag = "v0.1.2", optional = true }


libc = { version = "0.2", optional = true }

socket2 = { version = "0.5", optional = true }
rlimit = { version = "0.10", optional = true }

native-tls = { version = "0.2", features = ["alpn"], optional = true }
tokio-native-tls = { version = "0.3", optional = true }


quinn = { version = "0.10", optional = true }

# s2n-quic = { version = "=1.34.0", default-features = false, features = [
#     "provider-address-token-default",
#     "provider-tls-rustls",
# ], optional = true }
# s2n-quic-rustls = { version = "0.34.0", optional = true }


rustyline = { version = "15.0", optional = true }


TinyUFO = { version = "0.4", optional = true }


netstack-smoltcp = { version = "0.1.3", optional = true }
netstack-lwip = { git = "https://github.com/eycorsican/netstack-lwip.git", rev = "b7d9b0a", optional = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }

[dev-dependencies]

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"
wiremock = "0.6"


[features]
default = ["sockopt"]

trace = ["ruci/trace"]

steganography = []
api_server = ["axum", "tower-http", "TinyUFO", "utoipa", "utoipa-swagger-ui"]
file_server = ["axum", "tower-http"]

# quic = ["s2n-quic", "s2n-quic-rustls", "ruci-rustls21"]
quinn = ["ruci-rustls21", "dep:quinn"]


lua = ["mlua/luau", "serde-lua-table", "rustyline"]
lua54 = ["mlua/lua54", "mlua/vendored", "serde-lua-table", "rustyline"]

sockopt = ["libc", "socket2", "rlimit"]

use-native-tls = ["native-tls", "tokio-native-tls"]
native-tls-vendored = ["native-tls/vendored", "tokio-native-tls/vendored"]


lwip = ["netstack-lwip"]
smoltcp = ["netstack-smoltcp"]


[[example]]
name = "lua"
required-features = ["lua"]

[[example]]
name = "lua_infinite"
required-features = ["lua"]

[[example]]
name = "lua_trace"
required-features = ["lua"]

[[example]]
name = "shared"
crate-type = ["lib"]

[[bench]]
name = "spe1_benchmark"
harness = false
