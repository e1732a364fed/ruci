[package]
name = "rucimp"
version = "0.0.7"
edition = "2021"

[dependencies]
ruci = { path = ".." }
macro_map = { path = "../crates/macro_map" }

bytes = "1"
tracing = "0.1.40"
rand = { version = "0.8.5", features = ["small_rng"] }
chrono = { version = "0.4.34", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.114"
serde_cbor = "0.11.2"
toml = { version = "0.8.19", optional = true }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.10", features = [] }
async-trait = "0.1.77"
futures = "0.3"
futures-lite = "2"
parking_lot = "0.12.1"
dyn-clone = "1"
anyhow = "1"
lazy_static = "1"
base64 = "0.21.7"
itertools = "0.12.1"
thiserror = "1.0.58"


ipnet = { version = "2.9.0", optional = true }
iprange = { version = "0.6.7", optional = true }
regex = { version = "1.10.3", optional = true }
maxminddb = { version = "0.24", optional = true }

mlua = { version = "0.10.1", features = [
    "serialize",
    "async",
    "macros",
    'send',
], optional = true }

libc = { version = "0.2", optional = true }

socket2 = { version = "0.5.6", optional = true }
rlimit = { version = "0.10.1", optional = true }

native-tls = { version = "0.2.11", features = ["alpn"], optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }

http = "1.1.0"
tokio-tungstenite = "0.21.0"
h2 = "0.4.2"

rustls = { version = "0.21", optional = true, features = [
    "dangerous_configuration",
    "quic",
] }
rustls-pemfile = { version = "1.0", optional = true }
webpki-roots = { version = "0.22.6", optional = true }

quinn = { version = "0.10.2", optional = true }

s2n-quic = { version = "=1.34.0", default-features = false, features = [
    "provider-address-token-default",
    "provider-tls-rustls",
], optional = true }
s2n-quic-rustls = { version = "0.34.0", optional = true }


smoltcp = { version = "0.12", optional = true, default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
] }

array-init = "2.1.0"

rustyline = { version = "14.0.0", optional = true }

tar = "0.4.43"
md5 = "0.7.0"
zip = "2.2.2"

[dev-dependencies]

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["route", "geoip", "sockopt", "toml"]
steganography = []
rustls21 = ["dep:rustls", "rustls-pemfile", "webpki-roots"]

quic = ["s2n-quic", "s2n-quic-rustls", "rustls21"]
quinn = ["rustls21", "dep:quinn"]

tun = ["ruci/tun"]
trace = ["ruci/trace"]

lua = ["mlua/luau"]
lua54 = ["mlua/lua54", "mlua/vendored"]
repl = ["rustyline"]

route = ["ipnet", "iprange", "regex"]

geoip = ["maxminddb", "route"]

sockopt = ["libc", "socket2", "rlimit"]

use-native-tls = ["native-tls", "tokio-native-tls"]

native-tls-vendored = ["native-tls/vendored", "tokio-native-tls/vendored"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }


[[example]]
name = "chain"
required-features = ["lua", "route"]

[[example]]
name = "chain_infinite"
required-features = ["lua", "route"]

[[example]]
name = "chain_trace"
required-features = ["lua", "route"]

[[example]]
name = "shared"
crate-type = ["lib"]
